<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>MeBoard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>MeBoard</h1>

        <div class="auth-container" id="authContainer">
            <h2>Welcome</h2>
            <p>Sign in to sync your data across devices</p>
            <div id="authMessage" class="message"></div>

            <div id="loginForm">
                <input type="email" class="auth-input" id="emailInput" placeholder="Email address">
                <input type="password" class="auth-input" id="passwordInput" placeholder="Password">
                <button class="auth-btn" id="loginBtn">Sign In</button>
                <div class="auth-divider">
                    <span class="auth-link" id="forgotLink">Forgot password?</span>
                </div>
                <div class="auth-divider">Don't have an account? <span class="auth-link" id="registerLink">Sign Up</span></div>
            </div>

            <div id="forgotPasswordForm" style="display:none;">
                <input type="email" class="auth-input" id="resetEmailInput" placeholder="Enter your registered email">
                <button class="auth-btn" id="resetBtn">Send Reset Link</button>
                <div class="auth-divider">Remember your password? <span class="auth-link" id="backToLoginLink">Back to Sign In</span></div>
            </div>

            <div id="registerForm" style="display:none;">
                <input type="email" class="auth-input" id="regEmailInput" placeholder="Email address">
                <input type="password" class="auth-input" id="regPasswordInput" placeholder="Password (at least 6 characters)">
                <button class="auth-btn" id="registerBtn">Sign Up</button>
                <div class="auth-divider">Already have an account? <span class="auth-link" id="loginLink">Sign In</span></div>
            </div>

            <div id="resetPasswordForm" style="display:none;">
                <input type="password" class="auth-input" id="newPasswordInput" placeholder="New password (at least 6 characters)">
                <input type="password" class="auth-input" id="confirmPasswordInput" placeholder="Confirm new password">
                <button class="auth-btn" id="setPasswordBtn">Set New Password</button>
            </div>
        </div>

        <div class="app-container" id="appContainer">
            <div class="user-bar">
                <span class="user-email" id="userEmail"></span>
                <button class="logout-btn" id="logoutBtn">Sign Out</button>
            </div>

            <div class="input-section">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <select class="input-select" id="priorityInput">
                    <option value="P0">P0 Urgent</option>
                    <option value="P1">P1 High</option>
                    <option value="P2" selected>P2 Medium</option>
                    <option value="P3">P3 Low</option>
                </select>
                <input type="date" class="eta-input" id="etaInput" title="Expected completion date">
                <button type="button" class="upload-btn" id="uploadLabel" title="Upload image" onclick="document.getElementById('imageInput').click()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display:none">
                <button id="addBtn">Add</button>
            </div>
            <div id="imagePreviewBar" class="image-preview-bar" style="display:none;">
                <img id="uploadPreview" class="upload-preview-img">
                <button class="remove-image-btn" id="removeImageBtn">&times;</button>
            </div>

            <div class="todo-list" id="todoList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>

            <div class="stats" id="stats"></div>
        </div>
    </div>

    <div class="sync-indicator" id="syncIndicator">
        <div class="sync-dot"></div>
        <span>Syncing...</span>
    </div>

    <div class="image-modal" id="imageModal">
        <span class="image-modal-close" id="imageModalClose">&times;</span>
        <img id="imageModalImg" src="" alt="Preview">
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
